[package]
name    = "rs-gateway"
version = "0.1.0"
edition = "2024"

[dependencies]
rs-shared    = { path = "../rs-shared" }
actix-web    = "4"
serde        = { workspace = true }
serde_json   = { workspace = true }
tokio        = { workspace = true }
redis        = { workspace = true }
uuid         = { workspace = true }
jsonwebtoken = { version = "11", features = ["rust_crypto"] }
chrono       = "0.4"

[dev-dependencies]
reqwest     = { version = "0.12", features = ["json"] }
tokio       = { workspace = true }
serial_test = "3"
